<div class="regisztracio-card">
    <div class="regisztracio-header">
        <h1>Regisztráció</h1>
    </div>

    <form id="regisztracioForm" class="regisztracio-form">
        <div class="form-group">
            <input 
                type="text" 
                id="emberNev" 
                name="emberNev" 
                class="form-control" 
                placeholder="Embernév"
                required
                minlength="3"
                maxlength="30"
            >
            <span class="error-message" id="felhasznaloNevError"></span>
        </div>

        <div class="form-group">
            <input 
                type="email" 
                id="regEmail" 
                name="email" 
                class="form-control" 
                placeholder="Email cím"
                required
                autocomplete="email"
            >
            <span class="error-message" id="emailError"></span>
        </div>

        <div class="form-group">
            <input 
                type="password" 
                id="regJelszo" 
                name="jelszo" 
                class="form-control" 
                placeholder="Jelszó"
                required
                minlength="8"
                autocomplete="new-password"
            >
            <span class="error-message" id="jelszoError"></span>
        </div>

        <div class="form-group">
            <input 
                type="password" 
                id="jelszoIsmetles" 
                name="jelszoIsmetles" 
                class="form-control" 
                placeholder="Jelszó ismétlése"
                required
                minlength="8"
                autocomplete="new-password"
            >
            <span class="error-message" id="jelszoIsmetlesError"></span>
        </div>

        <div class="form-group">
            <input 
                type="text" 
                id="nev" 
                name="nev" 
                class="form-control" 
                placeholder="Teljes név"
                required
            >
            <span class="error-message" id="nevError"></span>
        </div>

        <div class="form-group">
            <input 
                type="text" 
                id="orszag" 
                name="orszag" 
                class="form-control" 
                placeholder="Ország"
                required
                list="orszagLista"
                autocomplete="off"
            >
            <datalist id="orszagLista">
            </datalist>
            <span class="error-message" id="orszagError"></span>
        </div>

        <div class="form-group">
            <input 
                type="text" 
                id="regio" 
                name="regio" 
                class="form-control" 
                placeholder="Régió"
                required
                list="regioLista"
                autocomplete="off"
            >
            <datalist id="regioLista">
            </datalist>
            <span class="error-message" id="regioError"></span>
        </div>

        <div class="form-group">
            <input 
                type="text" 
                id="telepules" 
                name="telepules" 
                class="form-control" 
                placeholder="Település"
                required
                list="telepulesLista"
                autocomplete="off"
            >
            <datalist id="telepulesLista">
            </datalist>
            <span class="error-message" id="telepulesError"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-full-width">
            Regisztráció
        </button>

        <div class="general-error" id="generalError"></div>
    </form>

    <div class="login-footer">
        <a href="#" id="bejelentkezesLink">Mégse</a>
    </div>
</div>
