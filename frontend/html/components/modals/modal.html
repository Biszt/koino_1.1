<!-- frontend/html/components/modals/modal.html -->

<!-- Félig átlátszó háttér – koppintásra bezárja a modalt (Modal.js kezeli) -->
<div class="modal-overlay" aria-hidden="true"></div>

<!-- Modal doboz – a méret CSS osztályt (modal-panel--szuk/alap/szeles) a Modal.js adja hozzá -->
<div
  class="modal-panel"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modal-cim-szoveg"
  aria-hidden="true"
  tabindex="-1"
>

  <!-- FEJLÉC: cím és bezáró gomb -->
  <div class="modal-fejlec">
    <!-- A cím szövegét a Modal.js tölti ki -->
    <h2 class="modal-cim" id="modal-cim-szoveg"></h2>

    <!-- Bezáró gomb – Modal.js köti be az eseményt -->
    <button
      class="modal-bezaro-gomb"
      type="button"
      aria-label="Modal bezárása"
    >✕</button>
  </div>

  <!-- HIBAÜZENET SÁV – alapból üres és rejtett, hibaBeallitasa() tölti fel -->
  <div class="modal-hiba" aria-live="polite" aria-atomic="true"></div>

  <!-- GONDOLAT – Modal.js tölti ki: string esetén innerHTML, DOM elem esetén appendChild -->
  <div class="modal-tartalom"></div>

  <!-- LÁBLÉC – csak akkor látható, ha a Modal.js gombokat ad hozzá -->
  <div class="modal-lablec"></div>

</div>
