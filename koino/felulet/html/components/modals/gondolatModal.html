<!-- frontend/html/components/modals/gondolatModal.html -->

<!-- A GondolatModal.js tölti be ezt a template-et fetch()-csel.
     A Modal alap struktúrája (overlay, panel, fejléc) a modal.html-ben van –
     ez csak a modal törzsének gondolatát, a formot adja meg. -->

<form class="t-modal-form" id="gondolat-modal-form" novalidate>

  <!-- ── CÍM ── -->
  <!-- Kötelező mező – GondolatModal._validalas() ellenőrzi -->
  <div class="t-modal-mezo">
    <input
      type="text"
      id="gondolat-cim"
      name="cim"
      class="t-modal-input"
      placeholder="Cím *"
      maxlength="200"
      autocomplete="off"
      aria-label="Cím – kötelező"
    />
  </div>

  <!-- ── SZÖVEG (SzovegSzerkeszto) ── -->
  <!-- A régi textarea helyett ez a div várja a SzovegSzerkeszto.js példányát.
       A GondolatModal._szovegSzerkesztoLetrehozasa() getElementById('szoveg-szerkeszto-kontener')
       segítségével keresi meg ezt az elemet, és ide építi be a szerkesztőt. -->
  <div class="t-modal-mezo">
    <div
      id="szoveg-szerkeszto-kontener"
      class="t-modal-szoveg-szerkeszto-kontener"
      aria-label="Szöveg szerkesztő"
    ></div>
  </div>

  <!-- ── GONDOLAT TÍPUS ── -->
  <!-- JS tölti fel a _tipusSelectFeltoltese() metódussal -->
  <div class="t-modal-mezo">
    <select
      id="gondolat-tipus"
      name="gondolatTipusId"
      class="t-modal-select"
      aria-label="Gondolat típus"
    >
      <option value="">Gondolat típus (opcionális)</option>
    </select>
  </div>

  <!-- ── KATEGÓRIÁK (max 3) ── -->
  <div class="t-modal-mezo">

    <!-- Kiválasztott kategóriák chip-jei – JS adja hozzá dinamikusan -->
    <div
      class="t-modal-kategoria-chipek"
      id="kategoria-chipek"
      aria-label="Kiválasztott kategóriák"
    ></div>

    <!-- Kategória hozzáadó lenyíló – JS tölti fel a _kategoriaSelectFeltoltese()-vel -->
    <select
      id="gondolat-kategoria-valaszto"
      class="t-modal-select"
      aria-label="Kategória hozzáadása (max. 3)"
    >
      <option value="">Kategória hozzáadása (max. 3)</option>
    </select>

  </div>

  <!-- ── KÜSZÖBÉRTÉKEK (döntéshozatal) ── -->
  <!-- Alapból rejtett – GondolatModal.init() mutatja meg, ha mód = 'letrehozas'.
       A négy mezőt a kuszobErtekMezok.js segédmodul injektálja a konténerbe,
       alapértelmezett értékekkel kitöltve. -->
  <div class="t-modal-mezo t-modal-kuszob-szakasz" id="kuszob-mezok-szakasz" hidden>
    <p class="t-modal-kuszob-cim">Küszöbértékek (a döntéshozatalhoz)</p>
    <p class="t-modal-kuszob-magyarazat">
      Ezek a Te javaslataid – a tényleges küszöb az összes érték javaslat mediánja.
      Az alapértékeket bármikor módosíthatod később is.
    </p>
    <div id="kuszob-mezok-kontener"></div>
  </div>

  <!-- ── KEZDŐ TUDATPONT ── -->
  <!-- Alapból rejtett – GondolatModal.init() mutatja meg, ha mód = 'letrehozas' -->
  <div class="t-modal-mezo" id="kezdo-tudatpont-mezo" hidden>
    <label class="kuszob-mezo__cimke" for="gondolat-kezdo-tudatpont">
      Kezdő tudatpont (min. 1) *
    </label>
    <input
      type="number"
      id="gondolat-kezdo-tudatpont"
      name="kezdoTudatpont"
      class="t-modal-input"
      min="1"
      value="1"
      placeholder="Kezdő tudatpont (min. 1) *"
      aria-label="Kezdő tudatpont – kötelező"
    />
  </div>

</form>
