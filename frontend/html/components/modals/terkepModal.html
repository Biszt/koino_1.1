<!-- frontend/html/components/modals/terkepModal.html -->

<!-- Ez a fájl a Modal.js .modal-tartalom elemébe töltődik be fetch()-csel.
     Három nézete van, egyszerre mindig csak egy látszik (a TerkepModal.js váltja):
       1. #terkep-indito — előzetes darabszám + Elkészítés/Mégse
       2. #terkep-epites — folyamatjelző + Megszakítás
       3. #terkep-nezet  — a kész térkép: Canvas alapréteg + SVG fedőréteg -->
<div class="terkep-modal">

  <!-- ===== 1. INDÍTÓ NÉZET ===== -->
  <div class="terkep-modal__indito" id="terkep-indito">
    <span class="terkep-modal__indito-ikon" aria-hidden="true">🗺️</span>
    <p class="terkep-modal__darabszam" id="terkep-darabszam-szoveg">
      Darabszám lekérése...
    </p>
    <div class="terkep-modal__indito-gombok">
      <button id="terkep-inditas-gomb" class="modal-gomb modal-gomb--elsodleges" type="button" hidden>
        Elkészítés
      </button>
      <button id="terkep-megse-gomb" class="modal-gomb modal-gomb--masodlagos" type="button">
        Mégse
      </button>
    </div>
  </div>

  <!-- ===== 2. ÉPÍTÉS NÉZET (folyamatjelző + megszakítás) ===== -->
  <div class="terkep-modal__epites" id="terkep-epites" hidden>
    <p class="terkep-modal__epites-szoveg" id="terkep-epites-szoveg">Előkészítés...</p>
    <div class="terkep-modal__folyamat" role="progressbar"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="terkep-folyamat">
      <div class="terkep-modal__folyamat-sav" id="terkep-folyamat-sav"></div>
    </div>
    <button id="terkep-megszakitas-gomb" class="modal-gomb modal-gomb--veszelyes" type="button">
      Megszakítás
    </button>
  </div>

  <!-- ===== 3. TÉRKÉP NÉZET (Canvas alap + SVG fedőréteg) ===== -->
  <div class="terkep-modal__nezet" id="terkep-nezet" hidden>
    <!-- Canvas alapréteg: a TELJES fa (élek + típus-színű pöttyök) -->
    <canvas class="terkep-modal__canvas" id="terkep-canvas"></canvas>
    <!-- SVG fedőréteg: csak a látható/közeli csomópontok, interaktívan
         (ikon + cím, kattintás, tooltip) — a TerkepModal.js tölti fel -->
    <svg class="terkep-modal__svg" id="terkep-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <!-- Vezérlő gombok: nagyítás/kicsinyítés/teljes fa behúzása -->
    <div class="terkep-modal__vezerlok">
      <button id="terkep-zoom-be-gomb" class="terkep-modal__vezerlo-gomb" type="button"
              aria-label="Nagyítás" title="Nagyítás">＋</button>
      <button id="terkep-zoom-ki-gomb" class="terkep-modal__vezerlo-gomb" type="button"
              aria-label="Kicsinyítés" title="Kicsinyítés">－</button>
      <button id="terkep-illesztes-gomb" class="terkep-modal__vezerlo-gomb" type="button"
              aria-label="Teljes fa mutatása" title="Teljes fa mutatása">⤢</button>
    </div>
    <p class="terkep-modal__sugo">
      Húzás: mozgatás · görgetés / ＋－: nagyítás · koppintás a csomópontra: ugrás
    </p>
  </div>

</div>
