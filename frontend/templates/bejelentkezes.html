    <div class="bejelentkezes-card">
        <div class="bejelentkezes-header">
            <h1>Bejelentkezés</h1>
        </div>

        <form id="bejelentkezesForm" class="bejelentkezes-form">
            <div class="form-group">
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-control" 
                    placeholder="Email cím"
                    required
                    autocomplete="email"
                >
                <span class="error-message" id="emailError"></span>
            </div>

            <div class="form-group">
                <input 
                    type="password" 
                    id="jelszo" 
                    name="jelszo" 
                    class="form-control" 
                    placeholder="Jelszó"
                    required
                    autocomplete="current-password"
                >
                <span class="error-message" id="jelszoError"></span>
            </div>

            <button type="submit" class="btn btn-primary btn-full-width">
                Bejelentkezés
            </button>

            <div class="general-error" id="generalError"></div>
        </form>

        <div class="login-footer">
            <a href="#" id="regisztracioLink">Regisztráció</a>
        </div>
    </div>
