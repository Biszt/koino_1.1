<!-- frontend/html/components/modals/ertesitesiBeallitasModal.html -->

<!-- Ez a fájl a Modal.js .modal-tartalom elemébe töltődik be fetch()-csel.
     A 7 eseménytípus checkbox-sorát az ErtesitesiBeallitasModal.js injektálja
     a #ertesites-beallitas-mezok konténerbe. -->
<div class="ertesitesi-beallitas-modal">

  <!-- Melyik entitásra vonatkozik (a JS tölti fel, ha kap címet) -->
  <p class="ertesitesi-beallitas-modal__entitas" id="ertesites-beallitas-entitas"></p>

  <!-- Bevezető magyarázat (globális módban a JS felülírja a szöveget) -->
  <p class="ertesitesi-beallitas-modal__bevezeto" id="ertesites-beallitas-bevezeto">
    Válaszd ki, mely eseményekről kérsz értesítést ebben az ágazatban. A beállítás a
    lejjebb lévő csomópontokra is öröklődik, amíg ott felül nem írod.
  </p>

  <!-- Forrás-magyarázat: örökölt / saját / nincs (a JS tölti fel megnyitáskor) -->
  <p class="ertesitesi-beallitas-modal__info" id="ertesites-beallitas-info" aria-live="polite"></p>

  <!-- A 7 eseménytípus checkbox-sorának helye – ide injektálja a JS a sorokat -->
  <div class="ertesitesi-beallitas-modal__mezok" id="ertesites-beallitas-mezok"></div>

  <!-- TUDATPONT-TULAJDONOSSÁGI SZŰRŐ: a kipipált eseménytípusokra rátett közös feltétel.
       Bekapcsolva csak akkor jön értesítés, ha az esemény entitásán van saját tudatpont.
       (Egyezmény-eseményre nem vonatkozik — egyezményre nem lehet tudatpontot tenni.) -->
  <label class="ertesitesi-beallitas-modal__sor ertesitesi-beallitas-modal__tudatpont-szuro">
    <input type="checkbox" id="ertesites-tudatpont-szuro" class="ertesitesi-beallitas-modal__pipa">
    <span class="ertesitesi-beallitas-modal__szoveg">
      <span class="ertesitesi-beallitas-modal__felirat">Csak ahol tudatpontom van</span>
      <span class="ertesitesi-beallitas-modal__magyarazat">
        Bekapcsolva csak akkor kapsz értesítést, ha az esemény entitásán saját tudatpontod
        van. (Egyezményen történt eseményre nem vonatkozik.)
      </span>
    </span>
  </label>

  <!-- E-MAILES KÉZBESÍTÉS: csak a GLOBÁLIS (fő menüs) módban látszik, mert ez az egész
       fiókra vonatkozik, nem egy ágra. A JS mutatja meg globális módban.
       A koino magától soha nem küld levelet — EZ A KAPCSOLÓ maga a kérés. -->
  <div class="ertesitesi-beallitas-modal__email" id="ertesites-email-szakasz" hidden>

    <label class="ertesitesi-beallitas-modal__sor">
      <input type="checkbox" id="ertesites-email-kapcsolo" class="ertesitesi-beallitas-modal__pipa">
      <span class="ertesitesi-beallitas-modal__szoveg">
        <span class="ertesitesi-beallitas-modal__felirat">E-mailben is kérem az értesítéseket</span>
        <span class="ertesitesi-beallitas-modal__magyarazat">
          Ugyanazokról az eseményekről, amiket fent kipipáltál — csak levélben is.
          Bármikor kikapcsolhatod itt.
        </span>
      </span>
    </label>

    <!-- Figyelmeztetés, ha nincs megerősített e-mail cím (a JS tölti ki) -->
    <p class="ertesitesi-beallitas-modal__email-figyelmeztetes"
       id="ertesites-email-figyelmeztetes" hidden></p>

    <!-- A KÉZBESÍTÉS ÜTEME — csak bekapcsolt e-mailes értesítésnél van értelme,
         ezért a JS mutatja/rejti a kapcsolóval együtt. -->
    <div class="ertesitesi-beallitas-modal__utem" id="ertesites-email-utem" hidden>

      <label class="ertesitesi-beallitas-modal__utem-sor">
        <input type="radio" name="ertesites-email-mod" value="osszefoglalo"
               id="ertesites-email-mod-osszefoglalo">
        <span>
          <strong>Összefoglaló</strong> — egy levél, benne az időszak értesítései
        </span>
      </label>

      <!-- Az időköz: gyorsválasztók + szabadon írható óraszám -->
      <div class="ertesitesi-beallitas-modal__orakoz" id="ertesites-email-orakoz-sor">
        <span class="ertesitesi-beallitas-modal__orakoz-cimke">Milyen gyakran:</span>

        <input type="number" id="ertesites-email-orakoz" min="1" max="168" step="1"
               class="ertesitesi-beallitas-modal__orakoz-mezo" aria-label="Összefoglaló időköze órában">
        <span class="ertesitesi-beallitas-modal__orakoz-egyseg">óránként</span>

        <div class="ertesitesi-beallitas-modal__gyorsvalaszto">
          <button type="button" data-orakoz="1">óránként</button>
          <button type="button" data-orakoz="6">6 óránként</button>
          <button type="button" data-orakoz="24">naponta</button>
          <button type="button" data-orakoz="168">hetente</button>
        </div>
      </div>

      <label class="ertesitesi-beallitas-modal__utem-sor">
        <input type="radio" name="ertesites-email-mod" value="azonnal"
               id="ertesites-email-mod-azonnal">
        <span>
          <strong>Azonnal</strong> — minden értesítésről külön levél, rögtön
        </span>
      </label>

    </div>

  </div>

</div>
