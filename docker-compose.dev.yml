services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: koino-backend
    # Fejlesztői kényelem: a konténer jöjjön vissza magától gép-/Docker-újraindulás után.
    restart: unless-stopped
    # FEJLESZTŐI stack: CSAK a helyi 3000-es port. A 8080-at (koino.hu → Cloudflare
    # Tunnel / IP) mostantól az ÉLES stack szolgálja ki (docker-compose.prod.yml),
    # hogy a localhoston végzett kódolás SOHA ne szivárogjon az éles oldalra.
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/koino  # ← Ez marad 27017 (belső hálózat)
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./frontend:/frontend
    depends_on:
      - mongodb
    networks:
      - koino-network

  mongodb:
    image: mongo:7.0
    container_name: koino-mongodb-dev
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - koino-network

volumes:
  mongodb-data:

networks:
  koino-network:
    driver: bridge
