<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>koino</title>
<link rel="stylesheet" href="./css/main.css">

<!--
  koino/felulet/index.html

  A koino felülete — a Szakasz 5.3-tól az ÖRÖKÖLT kártyákkal.

  ⭐ A kártyák (`js/components/kartya/`), a hamburger menü, a szövegmegjelenítő és a CSS
  **változatlanul** a prototípusból jöttek (`frontend/`), amihez nem nyúltunk: az éles
  rendszer onnan épül. Amit át kellett írni: az `apiHelper.js` (a helyi kapuhoz) és az
  `authHelper.js` (a koinóban nincs bejelentkezés — D15).

  ⏸️ Ami még hiányzik: a modálok (5.5) — helyükön helyőrző áll, ami megmondja, hogy még
  nem készültek el —, a belépő tér (5.6) és a szövegszerkesztő (5.7).

  ⭐⭐ A HÁZ (D100, 2026-10-10): a pakli is a prototípusé — a `Pakli.js` (láncos-testvéres
  nézet, kacsacsőrök, húzás, lapos rendezés) bájtra változatlanul jött át; a koinós többlet
  (a betöltés, a forrás jele, a lapos nézet lapozása) a `js/koinoPakli.js`-ben van.
-->
</head>
<body>

<header class="koino-fejlec">
  <h1>koino</h1>
  <span class="azonossag" id="azonossag"></span>
  <!-- ⭐ A TÉR/PAKLI VÁLTÓ (5.6): a tér a koinók FÖLÖTT áll, a pakli egy koinón BELÜL. -->
  <button type="button" class="ter-valto" id="ter-valto">A tér</button>
</header>

<!-- ===== A PAKLI — egy koinón BELÜL ===== -->
<div class="koino-sav" id="pakli-sav">
  <label for="rendezes">Rendezés</label>
  <!-- ⭐ A prototípus Rendezés-modáljának módjai és feliratai (D100): a hierarchikus a fa-szelet
       (a `Pakli.js` láncos-testvéres nézete — az alap), a többi lapos, rendezett lista. -->
  <select id="rendezes">
    <option value="hierarchikus">🌳 Hierarchikus (kapcsolatok szerint)</option>
    <option value="ido">🕒 Időrend</option>
    <option value="sajatPont">🌟 Saját tudatpont (közvetlen)</option>
    <option value="agazatiPont">🌿 Ágazati tudatpont (az egész ág)</option>
  </select>

  <!-- A hierarchikus nézetnek nincs iránya (mint a prototípusban). -->
  <select id="irany" disabled>
    <option value="csokkeno">csökkenő</option>
    <option value="novekvo">növekvő</option>
  </select>

  <button type="button" id="frissites">Frissítés</button>
  <!-- ⭐ ÚJ GONDOLAT (5.7) — eddig ez CSAK a parancssorból ment: a `GondolatModal` a
       szövegszerkesztőre várt, az pedig az 5.7-re. -->
  <button type="button" id="uj-gondolat">+ Új gondolat</button>
</div>

<!-- ===== A BELÉPŐ TÉR — a koinók FÖLÖTT (5.6) ===== -->
<div class="koino-sav" id="ter-sav" hidden>
  <label for="ter-rendezes">Rendezés</label>
  <select id="ter-rendezes">
    <!-- ⛔ LÉTSZÁM SZERINT SZÁNDÉKOSAN NINCS: az a D18/2-ben elvetett hamisítható
         toplista alakja. A program sem fogadja el (`ter.js`: RENDEZESEK). -->
    <option value="letrehozva">🕒 Létrehozás ideje</option>
    <option value="eloszorLattam">👁 Amikor először láttam</option>
    <option value="nev">🔤 Név</option>
  </select>

  <select id="ter-irany">
    <option value="csokkeno">csökkenő</option>
    <option value="novekvo">növekvő</option>
  </select>

  <button type="button" id="ter-frissites">Frissítés</button>
</div>

<p class="allapot" id="allapot">Betöltés…</p>

<main id="pakli" class="pakli"></main>
<main id="ter" hidden></main>

<div class="tovabb-sav">
  <button type="button" id="tovabb" hidden>További kártyák</button>
</div>

<!-- A lap-szintű modálok konténere (a kártyák sajátot kapnak, kártyánként) -->
<div id="modal-kontener"></div>

<script type="module">
import { KoinoPakli } from './js/koinoPakli.js';
import { TerNezet } from './js/terNezet.js';
import GondolatModal from './js/components/modals/GondolatModal.js';
import { aktivEntitasLekerese } from './js/utils/authHelper.js';

// ⭐ A HÁZ (D100): az örökölt `Pakli.js` a `#pakli` konténerbe rajzol, a modálok közös konténerébe nyit.
const pakli = new KoinoPakli('pakli', 'modal-kontener', {
  allapotElem: document.getElementById('allapot'),
  tovabbGomb: document.getElementById('tovabb'),
  azonossagElem: document.getElementById('azonossag')
});

document.getElementById('tovabb').addEventListener('click', () => pakli.tovabbiKartyak());
document.getElementById('frissites').addEventListener('click', () => pakli.frissites());

// A rendezés a `Pakli.js` saját útján (`rendezesBeallitasa` — a prototípusban a Rendezés-modal hívta).
const rendezesAlkalmazasa = () => {
  const mod = document.getElementById('rendezes').value;
  const irany = document.getElementById('irany');
  irany.disabled = (mod === 'hierarchikus');
  pakli.rendezesBeallitasa(mod, irany.value, null);
};
document.getElementById('rendezes').addEventListener('change', rendezesAlkalmazasa);
document.getElementById('irany').addEventListener('change', rendezesAlkalmazasa);

// ===================================
// ⭐ A BELÉPŐ TÉR (5.6) — és a váltás a pakli és a tér között
// ===================================
//
// ⚠️ A „belépés" NEM bejelentkezés (D15: a koinóban nincs ilyen) — csak annyi, hogy melyik
// koinót nézi ez a lap. A kulcsod minden koinóban ugyanaz; a TAGSÁG az, ami koino-helyi.

const terNezet = new TerNezet(
  document.getElementById('ter'),
  { allapotElem: document.getElementById('allapot') },
  // ⭐ Belépés után egyből a pakliba visszük — az új koino paklijával (a régi koinó fa-szeletei és mentett
  // kártyája nélkül: egy idegen azonosítóra a program kérelmet írna be).
  async () => { await mutat('pakli', { ujKoino: true }); }
);

const elemek = {
  pakli: [document.getElementById('pakli'), document.getElementById('pakli-sav')],
  ter: [document.getElementById('ter'), document.getElementById('ter-sav')]
};

async function mutat(melyik, { ujKoino = false } = {}) {
  for (const [nev, doboz] of Object.entries(elemek)) {
    for (const e of doboz) e.hidden = (nev !== melyik);
  }
  // A „További kártyák" gomb csak a paklihoz tartozik.
  document.getElementById('tovabb').hidden = true;
  document.getElementById('ter-valto').textContent = melyik === 'ter' ? 'A pakli' : 'A tér';

  if (melyik === 'ter') {
    // ⚠️ A testvér-jelző kacsacsőrei a lap aljára (`body`) kerülnek, nem a pakliba — a tér fölött ne lebegjenek.
    pakli.testverJelzo.eltavolitas();
    await terNezet.betoltes();
  } else if (ujKoino) await pakli.ujKoino();
  else await pakli.frissites();
}

// ===================================
// ⭐ ÚJ GONDOLAT (5.7) — az első valódi használója a szövegszerkesztőnek
// ===================================
//
// ⚠️ A modal a prototípusból jött, BÁJTRA VÁLTOZATLANUL — ahogy a kártyák az 5.3-ban.
// Egyetlen fájlt kellett átírni a szerkesztő alatt: a `FeltoltesKezelo`-t, mert a képek
// helye a P2P koinóban még eldöntetlen (D3).
document.getElementById('uj-gondolat').addEventListener('click', async () => {
  const modal = new GondolatModal('modal-kontener', {
    mod: 'letrehozas',
    // Létrejött → újratöltjük a paklit (mint a prototípus FoOldal-a: a mentett kártyától).
    onSiker: () => {
      const { entitasId, entitasTipus } = aktivEntitasLekerese();
      pakli.init(entitasId, entitasTipus);
    }
  });
  // ⚠️ AZ `init()` ÉPÍTI FEL A MODALT (sablon + szerkesztő); a `megnyitas()` csak
  // megmutatja. Enélkül a `this.modal` null marad, és a megnyitás NÉMÁN nem csinál
  // semmit — a prototípus `foOldal.js`-e is ebben a sorrendben hívja.
  await modal.init();
  modal.megnyitas();
});

document.getElementById('ter-valto').addEventListener('click', async () => {
  await mutat(document.getElementById('ter').hidden ? 'ter' : 'pakli');
});
document.getElementById('ter-frissites').addEventListener('click', () => terNezet.betoltes());
document.getElementById('ter-rendezes').addEventListener('change', (e) => {
  terNezet.rendezes = e.target.value;
  terNezet.betoltes();
});
document.getElementById('ter-irany').addEventListener('change', (e) => {
  terNezet.irany = e.target.value;
  terNezet.betoltes();
});

await pakli.indulas();
</script>

</body>
</html>
