<!-- frontend/html/components/modals/kategoriaModal.html -->

<!-- A KategoriaModal.js tölti be ezt a template-et fetch()-csel.
     A Modal alap struktúrája (overlay, panel, fejléc) a modal.html-ben van –
     ez csak a modal törzsének tartalmát, a formot adja meg. -->

<form class="k-modal-form" id="kategoria-modal-form" novalidate>

  <!-- ── NÉV ── -->
  <!-- Kötelező mező – KategoriaModal.validalas() ellenőrzi -->
  <div class="k-modal-mezo">
    <input
      type="text"
      id="kategoria-nev"
      name="nev"
      class="k-modal-input"
      placeholder="Kategória neve *"
      maxlength="100"
      autocomplete="off"
      aria-label="Kategória neve – kötelező"
    />
  </div>

  <!-- ── LEÍRÁS (blokk-alapú szövegszerkesztő) ── -->
  <!-- A KategoriaModal._szovegSzerkesztoLetrehozasa() ide példányosítja a
       SzovegSzerkeszto komponenst (mint a TartalomModal-ban). A korábbi sima
       <textarea> holt kód volt (a JS a szerkesztő-konténert kereste, ami hiányzott),
       ezért a kategória leírása nem mentődött — most a valódi szerkesztő kerül ide. -->
  <div class="k-modal-mezo">
    <div id="leiras-szerkeszto-kontener"></div>
  </div>

  <!-- ── IKON FELTÖLTÉS ── -->
  <!-- Kötelező fájl mező – KategoriaModal.validalas() ellenőrzi -->
  <!-- accept: csak képfájlokat enged, a Multer is csak ezeket fogadja el -->
  <div class="k-modal-mezo">

    <!-- Fájlválasztó input – vizuálisan elrejtve, a gomb aktiválja -->
    <input
      type="file"
      id="kategoria-ikon-input"
      name="ikon"
      class="k-modal-fajl-input"
      accept="image/png, image/jpeg, image/gif, image/svg+xml, image/webp"
      aria-label="Ikon képfájl feltöltése – kötelező"
    />

    <!-- Egyedi stílusú fájlválasztó gomb – rákattintva megnyitja az input-ot -->
    <button
      type="button"
      class="k-modal-fajl-gomb"
      id="kategoria-ikon-gomb"
      aria-label="Ikon fájl kiválasztása"
    >
      🌿 Ikon kiválasztása
    </button>

    <!-- Kiválasztott fájl neve – JS írja ki ide, alapból üres -->
    <span
      class="k-modal-fajl-nev"
      id="kategoria-ikon-nev"
      aria-live="polite"
    >Nincs kiválasztott fájl</span>

  </div>

  <!-- ── IKON ELŐNÉZET ── -->
  <!-- Alapból rejtett – JS mutatja meg fájlválasztás után -->
  <div class="k-modal-mezo k-modal-elonezet-kontener" id="kategoria-ikon-elokezet" hidden>
    <img
      id="kategoria-ikon-elonezet-kep"
      class="k-modal-elokezet-kep"
      src=""
      alt="Ikon előnézet"
      width="64"
      height="64"
    />
  </div>

  <!-- ── KÜSZÖBÉRTÉKEK (döntéshozatal) ── -->
  <!-- Alapból rejtett – KategoriaModal.init() mutatja meg, ha mód = 'letrehozas'.
       A négy mezőt a kuszobErtekMezok.js segédmodul injektálja alapértékekkel. -->
  <div class="k-modal-mezo t-modal-kuszob-szakasz" id="kategoria-kuszob-szakasz" hidden>
    <p class="t-modal-kuszob-cim">Küszöbértékek (a döntéshozatalhoz)</p>
    <p class="t-modal-kuszob-magyarazat">
      Ezek a Te javaslataid – a tényleges küszöb az összes érték javaslat mediánja.
    </p>
    <div id="kategoria-kuszob-mezok-kontener"></div>
  </div>

  <!-- ── KEZDŐ TUDATPONT ── -->
  <!-- Alapból rejtett – KategoriaModal.init() mutatja meg, ha mód = 'letrehozas' -->
  <div class="k-modal-mezo" id="kategoria-kezdo-tudatpont-mezo" hidden>
    <input
      type="number"
      id="kategoria-kezdo-tudatpont"
      name="kezdoTudatpont"
      class="k-modal-input"
      min="1"
      value="1"
      placeholder="Kezdő tudatpont (min. 1) *"
      aria-label="Kezdő tudatpont – kötelező"
    />
  </div>

</form>
